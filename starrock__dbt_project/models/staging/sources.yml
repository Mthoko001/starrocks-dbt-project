version: 2

sources:
  - name: staging_db
    database: default_catalog      # ← catalog
    schema: staging_db             # ← actual database
    loaded_at_field: TS
    tables:
      - name: BILL_SERVICE_PROVIDER
        description: "Raw billing service provider data loaded daily"
        columns:
          - name: BILL_SERVICE_PROVIDER
            description: "Unique provider ID"
          - name: TS
            description: "Load timestamp - used for incremental"
            tests:
              - not_null